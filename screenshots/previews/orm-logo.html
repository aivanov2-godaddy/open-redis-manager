<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Redis Manager logo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px; color: #172033; background: #f3f5f9; font: 16px/1.5 Inter, "Segoe UI", sans-serif; }
    main { width: min(100%, 1040px); padding: 64px 72px 56px; border: 1px solid #e1e6ef; border-radius: 28px; background: #fff; box-shadow: 0 28px 80px #263b5710; text-align: center; }
    .eyebrow { margin: 0 0 24px; color: #b42318; font-size: 12px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    .hero-mark { display: block; width: 180px; height: 180px; margin: 0 auto 26px; filter: drop-shadow(0 16px 22px #c81e1820); }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.035em; line-height: 1.1; }
    .subtitle { max-width: 500px; margin: 14px auto 42px; color: #647084; font-size: 17px; }
    .sizes { display: flex; align-items: end; justify-content: center; gap: 40px; border-top: 1px solid #e8ecf2; padding-top: 28px; }
    .size { display: grid; justify-items: center; gap: 10px; color: #718096; font-size: 12px; }
    .size img { display: block; }
    .s24 { width: 24px; height: 24px; }.s32 { width: 32px; height: 32px; }.s48 { width: 48px; height: 48px; }
    @media (max-width: 600px) { body { padding: 18px; } main { padding: 44px 20px 32px; } .hero-mark { width: 148px; height: 148px; } .sizes { gap: 24px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">New brand mark</p>
    <img class="hero-mark" src="../../assets/orm-mark.svg" alt="">
    <h1>Open Redis Manager</h1>
    <p class="subtitle">A layered cache core with an open data path, built to stay clear from the dashboard down to the app icon.</p>
    <div class="sizes" aria-label="Logo legibility at smaller sizes">
      <div class="size"><img class="s24" src="../../assets/orm-mark.svg" alt=""><span>24 px</span></div>
      <div class="size"><img class="s32" src="../../assets/orm-mark.svg" alt=""><span>32 px</span></div>
      <div class="size"><img class="s48" src="../../assets/orm-mark.svg" alt=""><span>48 px</span></div>
    </div>
  </main>
</body>
</html>
