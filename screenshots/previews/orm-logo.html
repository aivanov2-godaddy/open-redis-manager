<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Redis Manager · Brand mark</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px; color: #182230; background: #f3f5f9; font: 16px/1.5 Inter, "Segoe UI", sans-serif; }
    main { width: min(100%, 1040px); min-height: 720px; padding: 66px 72px 52px; border: 1px solid #e1e6ef; border-radius: 28px; background: #fff; box-shadow: 0 28px 80px #263b5710; text-align: center; }
    .eyebrow { margin: 0 0 18px; color: #b42318; font-size: 12px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 42px); letter-spacing: -.04em; line-height: 1.12; }
    .subtitle { max-width: 540px; margin: 13px auto 30px; color: #647084; font-size: 16px; }
    .hero-mark { display: block; width: 176px; height: 176px; margin: 0 auto 31px; filter: drop-shadow(0 16px 22px #c81e1826); }
    .rule { height: 1px; margin: 0 0 28px; background: #e8ecf2; }
    .sizes { display: flex; align-items: end; justify-content: center; gap: 44px; }
    .size { display: grid; justify-items: center; gap: 10px; color: #718096; font-size: 12px; }
    .size img { display: block; }
    .s24 { width: 24px; height: 24px; }.s32 { width: 32px; height: 32px; }.s48 { width: 48px; height: 48px; }
    .caption { margin: 34px 0 0; color: #8893a3; font-size: 12px; letter-spacing: .02em; }
    @media (max-width: 600px) { body { padding: 18px; } main { min-height: unset; padding: 48px 20px 34px; } .hero-mark { width: 148px; height: 148px; } .sizes { gap: 28px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A clearer kind of cache control</p>
    <h1>Open Redis Manager <span>(ORM)</span></h1>
    <p class="subtitle">A faceted cache prism with its controls built into the mark.</p>
    <img class="hero-mark" src="../../assets/orm-mark.svg" alt="Red ORM app icon with a white cache prism and integrated control sliders">
    <div class="rule"></div>
    <div class="sizes" aria-label="Logo legibility at smaller sizes">
      <div class="size"><img class="s24" src="../../assets/orm-mark.svg" alt=""><span>24 px</span></div>
      <div class="size"><img class="s32" src="../../assets/orm-mark.svg" alt=""><span>32 px</span></div>
      <div class="size"><img class="s48" src="../../assets/orm-mark.svg" alt=""><span>48 px</span></div>
    </div>
    <p class="caption">One continuous symbol: cache layers, an open center, and precise controls.</p>
  </main>
</body>
</html>
