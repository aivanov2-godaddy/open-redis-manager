<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Open Redis Manager WHM command visibility preview</title>
  <desc id="desc">Synthetic root-only diagnostics view showing Redis command names, cumulative call counts, and CPU time. Command arguments, keys, and values are omitted.</desc>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F04438"/><stop offset="1" stop-color="#B42318"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#172B4D" flood-opacity=".08"/></filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .label { fill:#66768A; font-size:13px; font-weight:650; letter-spacing:.06em; }
      .body { fill:#263548; font-size:16px; }
      .muted { fill:#68788D; font-size:14px; }
      .strong { fill:#172435; font-weight:700; }
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#F2F5F9"/>
  <rect width="1440" height="76" fill="#FFFFFF"/>
  <path d="M0 75.5H1440" stroke="#DCE3EC"/>
  <g transform="translate(29 15) scale(.18)"><rect x="4" y="4" width="248" height="248" rx="58" fill="url(#red)"/><path d="M169 80a66 66 0 1 0 0 96" fill="none" stroke="#FFF" stroke-width="14" stroke-linecap="round"/><path d="M91 105h60M98 128h46M105 151h32M163 128h24" fill="none" stroke="#FFF" stroke-width="10" stroke-linecap="round"/><circle cx="193" cy="128" r="12" fill="#FFF"/><circle cx="193" cy="128" r="4" fill="#D92D20"/></g>
  <text x="83" y="47" class="strong" font-size="18">Open Redis Manager</text>
  <text x="290" y="47" class="muted">WHM</text><text x="326" y="47" fill="#A9B4C1" font-size="18">›</text><text x="346" y="47" class="muted">Managed instances</text>
  <rect x="1231" y="20" width="177" height="36" rx="18" fill="#EFF7F3" stroke="#C7E7D7"/><circle cx="1251" cy="38" r="5" fill="#14804A"/><text x="1264" y="43" fill="#176B45" font-size="13" font-weight="700">ROOT-ONLY VIEW</text>
  <text x="48" y="132" fill="#B42318" font-size="13" font-weight="750" letter-spacing="2">WHM / OPEN REDIS MANAGER</text>
  <text x="48" y="179" class="strong" font-size="34">Command visibility</text>
  <text x="48" y="210" class="muted" font-size="16">Inspect aggregate Redis/Valkey command activity for one verified account.</text>
  <rect x="48" y="244" width="1344" height="76" rx="12" fill="#EFF6FF" stroke="#C9DCF5"/>
  <circle cx="76" cy="282" r="12" fill="#D6E7FF"/><text x="76" y="287" text-anchor="middle" fill="#245B9C" font-size="15" font-weight="800">i</text>
  <text x="100" y="276" fill="#315477" font-size="15" font-weight="700">Read-only counters</text>
  <text x="100" y="299" fill="#315477" font-size="14">Command names, calls and cumulative CPU time only. Command arguments, keys and values are never requested or displayed.</text>
  <rect x="48" y="350" width="1344" height="550" rx="14" fill="#FFFFFF" stroke="#D9E1EB" filter="url(#shadow)"/>
  <path d="M48 364a14 14 0 0 1 14-14h1316a14 14 0 0 1 14 14v76H48Z" fill="#FBFCFE"/>
  <path d="M48 440H1392" stroke="#E5EAF0"/>
  <text x="78" y="393" class="strong" font-size="21">INFO commandstats</text>
  <text x="78" y="420" class="muted">Redis · 7.2.4 · account demo</text>
  <rect x="1172" y="377" width="188" height="38" rx="19" fill="#EFF6FF" stroke="#C9DCF5"/>
  <text x="1266" y="401" text-anchor="middle" fill="#315477" font-size="12" font-weight="700">MOST CALLED FIRST</text>
  <rect x="78" y="470" width="1284" height="58" rx="8" fill="#F7F9FC"/>
  <text x="104" y="505" class="label">COMMAND</text><text x="700" y="505" class="label">CALLS SINCE RESTART</text><text x="1100" y="505" class="label">TOTAL CPU TIME (µs)</text>
  <g class="body">
    <path d="M78 543H1362" stroke="#EDF0F4"/><text x="104" y="578" class="strong">GET</text><text x="700" y="578">2,845,019</text><text x="1100" y="578">12,945,300</text>
    <path d="M78 605H1362" stroke="#EDF0F4"/><text x="104" y="640" class="strong">SET</text><text x="700" y="640">1,942,588</text><text x="1100" y="640">9,128,455</text>
    <path d="M78 667H1362" stroke="#EDF0F4"/><text x="104" y="702" class="strong">EXPIRE</text><text x="700" y="702">465,912</text><text x="1100" y="702">1,604,212</text>
    <path d="M78 729H1362" stroke="#EDF0F4"/><text x="104" y="764" class="strong">MGET</text><text x="700" y="764">208,041</text><text x="1100" y="764">1,210,440</text>
    <path d="M78 791H1362" stroke="#EDF0F4"/><text x="104" y="826" class="strong">PING</text><text x="700" y="826">84,110</text><text x="1100" y="826">197,300</text>
  </g>
  <rect x="78" y="852" width="1284" height="30" rx="6" fill="#FFF8F6"/>
  <text x="96" y="872" fill="#7C2D26" font-size="12">Counters reset when the service restarts; values are cumulative, not a time-window rate. Command arguments are not included.</text>
  <text x="720" y="948" text-anchor="middle" fill="#7C8999" font-size="12">Synthetic preview · not connected to a WHM host or Redis/Valkey service</text>
</svg>
