<text x="578" y="710" fill="#667085" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Creates and validates a safety snapshot before switching. ORM attempts</text><text x="578" y="730" fill="#667085" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">to restore Redis automatically if Valkey fails its health checks.</text>
