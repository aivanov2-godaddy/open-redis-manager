<text x="578" y="537" fill="#594b2b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Stop or pause web workers, queue consumers, scheduled jobs, and any</text><text x="578" y="558" fill="#594b2b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">external service that writes to Redis. The cache will be interrupted.</text>
