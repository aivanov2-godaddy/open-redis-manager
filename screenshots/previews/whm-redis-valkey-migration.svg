<circle cx="99" cy="237" r="8" fill="#16a36a"/><text x="122" y="232" fill="#172235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Migration guardrails</text><text x="122" y="256" fill="#647084" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Redis 6.2–7.2  →  Valkey 7.2+ · snapshot validation · automatic rollback attempt</text>
