repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-ast
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: php-lint
        name: PHP syntax check
        entry: python bin/lint-php.py
        language: system
        types: [php]
      - id: php-account-context
        name: cPanel account-context checks
        entry: php tests/cpanel-account-context.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-application-discovery
        name: cPanel application discovery checks
        entry: php tests/cpanel-application-discovery.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-first-run-setup-policy
        name: cPanel first-run setup policy checks
        entry: php tests/cpanel-first-run-setup-policy.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-health-guidance
        name: cPanel health guidance checks
        entry: php tests/cpanel-health-guidance.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-podman-lifecycle
        name: cPanel EA Podman lifecycle checks
        entry: php tests/cpanel-podman-lifecycle.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-podman-metrics
        name: cPanel EA Podman metrics checks
        entry: php tests/cpanel-podman-metrics.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-whm-audit-log
        name: WHM audit log checks
        entry: php tests/whm-audit-log.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-whm-acl
        name: WHM ACL checks
        entry: php tests/whm-acl.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-session-request-guard
        name: cPanel and WHM session-token checks
        entry: php tests/session-request-guard.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-whm-security-report
        name: WHM security report checks
        entry: php tests/whm-security-report.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-whm-security-report-policy
        name: WHM security report policy checks
        entry: php tests/whm-security-report-policy.php
        language: system
        pass_filenames: false
        always_run: true
      - id: php-release-preview
        name: WHM signed release preview checks
        entry: php tests/release-preview.php
        language: system
        pass_filenames: false
        always_run: true
      - id: cpanel-icon-assets
        name: cPanel icon asset checks
        entry: python tests/cpanel-icon-assets.py
        language: system
        pass_filenames: false
        always_run: true
      - id: cpanel-live-isolation-smoke-checks
        name: cPanel live isolation smoke assertions
        entry: python tests/cpanel-live-isolation-smoke-checks.py
        language: system
        pass_filenames: false
        always_run: true
      - id: cpanel-live-podman-lifecycle-smoke-checks
        name: cPanel live Podman lifecycle smoke assertions
        entry: python tests/cpanel-live-podman-lifecycle-smoke-checks.py
        language: system
        pass_filenames: false
        always_run: true
      - id: cpanel-live-podman-web-isolation-smoke-checks
        name: cPanel live Podman web isolation smoke assertions
        entry: python tests/cpanel-live-podman-web-isolation-smoke-checks.py
        language: system
        pass_filenames: false
        always_run: true
      - id: whm-live-diagnostics-smoke-checks
        name: WHM live diagnostics smoke assertions
        entry: python tests/whm-live-diagnostics-form-checks.py
        language: system
        pass_filenames: false
        always_run: true
