<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="orm-title orm-desc">
  <title id="orm-title">Open Redis Manager</title>
  <desc id="orm-desc">An open white control loop surrounds a faceted cache core on an ORM red tile.</desc>
  <defs>
    <linearGradient id="orm-red" x1="28" y1="20" x2="228" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ED493C"/>
      <stop offset="1" stop-color="#C92319"/>
    </linearGradient>
    <linearGradient id="orm-core" x1="93" y1="91" x2="163" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F4F8"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="66" fill="url(#orm-red)"/>
  <rect x="5" y="5" width="246" height="246" rx="65" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="2"/>

  <!-- The open loop is the ORM “O”; its two endpoints meet the connected cache core. -->
  <path d="M166 63C154 55 141 51 128 51 85.5 51 51 85.5 51 128s34.5 77 77 77 77-34.5 77-77c0-15-4.3-29-12-40" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <circle cx="166" cy="63" r="7" fill="#FFFFFF"/>
  <circle cx="193" cy="88" r="7" fill="#FFFFFF"/>

  <!-- A single faceted core evokes a cache node without repeating a database-stack motif. -->
  <path d="m128 87 41 41-41 41-41-41 41-41Z" fill="url(#orm-core)"/>
  <path d="m128 104 24 24-24 24-24-24 24-24Z" fill="#C92319"/>
  <circle cx="128" cy="128" r="7" fill="#FFFFFF"/>
</svg>
