<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="orm-title orm-desc">
  <title id="orm-title">Open Redis Manager</title>
  <desc id="orm-desc">A white, three-tier cache stack with a central node on a red tile.</desc>
  <defs>
    <linearGradient id="orm-red" x1="28" y1="20" x2="228" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E83B2E"/>
      <stop offset="1" stop-color="#C92218"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="62" fill="url(#orm-red)"/>
  <rect x="5" y="5" width="246" height="246" rx="61" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="2"/>

  <!-- Three connected cache layers, drawn with a bold silhouette for small UI icons. -->
  <path d="M128 55 187 86v73l-59 32-59-32V86l59-31Z" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m72 108 56 30 56-30M72 132l56 30 56-30" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The cache node gives the mark a distinct ORM center and survives at 24 px. -->
  <path d="m128 73 29 15-29 15-29-15 29-15Z" fill="#FFFFFF"/>
  <circle cx="128" cy="88" r="5.5" fill="#C92218"/>
</svg>
