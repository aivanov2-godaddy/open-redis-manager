name: Feature request
description: Propose a capability for Open Redis Manager
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, customer information, or private server logs."
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is blocked and what task are they trying to complete?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired cPanel or WHM behavior and its authorization boundary.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and failure cases.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: cPanel/WHM, OS, backend and PHP versions if relevant; omit private identifiers.
