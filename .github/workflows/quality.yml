name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0
      - name: Run pre-commit checks
        run: pre-commit run --all-files
      - name: Check packaging shell syntax
        run: bash -n packaging/install.sh packaging/uninstall.sh packaging/upgrade.sh packaging/lib.sh tests/packaging-install.sh tests/packaging-upgrade.sh
      - name: Check packaging fresh install and rollback
        run: sudo bash tests/packaging-install.sh
      - name: Check packaging instance-root guards
        run: sudo bash tests/packaging-guards.sh
      - name: Check packaging upgrade integrity and rollback
        run: sudo bash tests/packaging-upgrade.sh
      - name: Check live cPanel smoke-test entry point
        run: python tests/cpanel-live-smoke.py --help >/dev/null
      - name: Check broker Perl syntax and tests
        run: |
          for file in src/Orm/Broker/*.pm bin/orm-broker.pl bin/orm-instance-launcher.pl bin/orm-metrics-collect.pl; do perl -I src -c "$file"; done
          prove -I src tests/*.t
      - name: Check cPanel broker client
        run: php tests/cpanel-broker-client.php
      - name: Check cPanel connection details
        run: php tests/cpanel-connection-details.php
      - name: Check cPanel Podman cache discovery
        run: php tests/cpanel-podman-cache-discovery.php
      - name: Check WHM fleet summary and batch UI guards
        run: php tests/fleet-ui.php
      - name: Check WHM report-only security findings and throttling
        run: php tests/whm-security-report.php
      - name: Check cPanel diagnostic report
        run: php tests/cpanel-diagnostic-report.php
      - name: Check cPanel health guidance
        run: php tests/cpanel-health-guidance.php
      - name: Check cPanel application discovery
        run: php tests/cpanel-application-discovery.php
      - name: Check provider package policy storage
        run: php tests/provider-policy-store.php
      - name: Check provider package policy UI guards
        run: php tests/provider-policy-ui.php
      - name: Check WHM audit log normalization and export
        run: php tests/whm-audit-log.php
      - name: Check cPanel and WHM session mutation guard
        run: php tests/session-request-guard.php
      - name: Stage instance launcher for systemd unit verification
        run: sudo install -D -m 0755 bin/orm-instance-launcher.pl /usr/local/cpanel/3rdparty/orm/bin/orm-instance-launcher
      - name: Stage metrics collector for systemd unit verification
        run: sudo install -D -m 0755 bin/orm-metrics-collect.pl /usr/local/cpanel/3rdparty/orm/bin/orm-metrics-collect.pl
      - name: Verify ORM systemd units
        run: systemd-analyze verify packaging/systemd/orm-broker.service packaging/systemd/orm-instance@.service packaging/systemd/orm-metrics-collect@.service packaging/systemd/orm-metrics-collect@.timer
