name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0
      - name: Run pre-commit checks
        run: pre-commit run --all-files
      - name: Check packaging shell syntax
        run: bash -n packaging/install.sh packaging/uninstall.sh packaging/lib.sh
      - name: Check broker Perl syntax and tests
        run: |
          for file in src/Orm/Broker/*.pm bin/orm-broker.pl; do perl -I src -c "$file"; done
          prove -I src tests/broker.t
      - name: Verify systemd broker unit
        run: systemd-analyze verify packaging/systemd/orm-broker.service
